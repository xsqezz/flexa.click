name: Flexa — GitHub Pages
on:
  push:
    branches: [main]
    paths: [site/**, app/**, shared/**, scripts/build-site.mjs, package.json, package-lock.json, .github/workflows/pages.yml]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - uses: actions/configure-pages@v5
      - name: Build landing and complete local demo, without backend keys
        run: npm run build:pages
        env:
          FLEXA_APP_URL: ${{ vars.FLEXA_APP_URL }}
          FLEXA_SITE_DOMAIN: ${{ vars.FLEXA_SITE_DOMAIN }}
      - uses: actions/upload-pages-artifact@v4
        with:
          path: dist-site
  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/deploy-pages@v4
        id: deployment
