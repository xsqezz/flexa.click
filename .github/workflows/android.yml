name: Flexa Android
on:
  pull_request:
    paths:
      - android/**
      - scripts/android*.mjs
      - scripts/lib/android-version.mjs
      - .github/workflows/android.yml
  push:
    branches: [main]
    tags: ['android-v*']
    paths:
      - android/**
      - scripts/android*.mjs
      - scripts/lib/android-version.mjs
      - .github/workflows/android.yml
  workflow_dispatch:

permissions:
  contents: read

defaults:
  run:
    shell: bash

concurrency:
  group: android-${{ github.ref }}
  cancel-in-progress: ${{ !startsWith(github.ref, 'refs/tags/') }}

jobs:
  check:
    name: Testy i build
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - uses: gradle/actions/wrapper-validation@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 24
      - name: Testy skryptów wydawniczych
        run: npm run test:android-scripts
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 21
          cache: gradle
          cache-dependency-path: |
            android/**/*.gradle*
            android/gradle/libs.versions.toml
            android/gradle/wrapper/gradle-wrapper.properties
      - uses: android-actions/setup-android@v4
        with:
          packages: 'platform-tools platforms;android-37.0 build-tools;36.0.0'
      - name: Testy jednostkowe, lint i build wydania (bez prawdziwego klucza)
        working-directory: android
        run: ./gradlew --no-daemon --console=plain --stacktrace :app:testDebugUnitTest :app:lintDebug :app:assembleRelease -Pflexa.allowDebugSigning=true
      - uses: actions/upload-artifact@v7
        if: failure()
        with:
          name: android-reports
          path: |
            android/app/build/reports
            android/app/build/test-results
          retention-days: 7

  release:
    name: Publikacja wydania
    needs: check
    if: startsWith(github.ref, 'refs/tags/android-v')
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: write
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
      - name: Sprawdź, czy tag odpowiada wersji z android/version.properties
        run: |
          version="$(sed -n 's/^VERSION_NAME=//p' android/version.properties | tr -d '\r')"
          if [ "$GITHUB_REF_NAME" != "android-v${version}" ]; then
            echo "::error::Tag ${GITHUB_REF_NAME} nie pasuje do wersji ${version} (oczekiwano android-v${version})."
            exit 1
          fi
          echo "VERSION_NAME=${version}" >> "$GITHUB_ENV"
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 21
          cache: gradle
          cache-dependency-path: |
            android/**/*.gradle*
            android/gradle/libs.versions.toml
            android/gradle/wrapper/gradle-wrapper.properties
      - uses: android-actions/setup-android@v4
        with:
          packages: 'platform-tools platforms;android-37.0 build-tools;36.0.0'
      - name: Przygotuj klucz podpisujący
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          if [ -z "$ANDROID_KEYSTORE_BASE64" ]; then
            echo "::error::Brak sekretu ANDROID_KEYSTORE_BASE64. Zob. docs/ANDROID.md (node scripts/android-signing.mjs github)."
            exit 1
          fi
          printf '%s' "$ANDROID_KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/flexa-release.jks"
      - name: Zbuduj podpisany APK
        working-directory: android
        env:
          FLEXA_KEYSTORE_FILE: ${{ runner.temp }}/flexa-release.jks
          FLEXA_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          FLEXA_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          FLEXA_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: ./gradlew --no-daemon --console=plain --stacktrace :app:assembleRelease
      - name: Sprawdź podpis APK
        run: |
          cp android/app/build/outputs/apk/release/app-release.apk flexa.apk
          apksigner="$(find "$ANDROID_HOME/build-tools" -name apksigner -type f | sort -V | tail -n 1)"
          test -n "$apksigner"
          "$apksigner" verify --verbose --print-certs flexa.apk | tee apksigner.txt
          grep -q 'APK Signature Scheme v2): true' apksigner.txt
          grep -q 'APK Signature Scheme v3): true' apksigner.txt
          actual="$(sed -n 's/^Signer #1 certificate SHA-256 digest: //p' apksigner.txt | tr 'A-F' 'a-f')"
          expected="$(tr -d ': \r\n' < android/signing-fingerprint.txt | tr 'A-F' 'a-f')"
          if [ -z "$actual" ] || [ "$actual" != "$expected" ]; then
            echo "::error::Odcisk certyfikatu APK (${actual}) różni się od android/signing-fingerprint.txt (${expected}). Aktualizacje zainstalowanych aplikacji by nie przeszły."
            exit 1
          fi
      - name: Utwórz update.json
        run: node scripts/android-manifest.mjs --apk flexa.apk --out update.json --tag "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY"
      - name: Opublikuj wydanie
        run: |
          sha="$(node -p "require('./update.json').sha256")"
          {
            node -p "require('./update.json').notes.map((line) => '- ' + line).join('\n')"
            echo
            echo "Pobierz **flexa.apk** i zainstaluj ją na telefonie z Androidem 8.0 lub nowszym. Zainstalowane już aplikacje same zaproponują tę wersję."
            echo
            echo "SHA-256: \`${sha}\`"
          } > release-notes.md
          if gh release view "$GITHUB_REF_NAME" > /dev/null 2>&1; then
            gh release upload "$GITHUB_REF_NAME" flexa.apk update.json --clobber
            gh release edit "$GITHUB_REF_NAME" --latest --notes-file release-notes.md
          else
            gh release create "$GITHUB_REF_NAME" flexa.apk update.json --verify-tag --latest \
              --title "Flexa na Androida ${VERSION_NAME}" --notes-file release-notes.md
          fi
      - name: Sprawdź opublikowane pliki
        run: |
          ok=0
          for attempt in $(seq 1 12); do
            if curl -fsSL "https://github.com/${GITHUB_REPOSITORY}/releases/latest/download/update.json" -o published.json \
              && node -e '
                const fs = require("fs")
                const local = JSON.parse(fs.readFileSync("update.json", "utf8"))
                const published = JSON.parse(fs.readFileSync("published.json", "utf8"))
                process.exit(published.versionCode === local.versionCode && published.sha256 === local.sha256 ? 0 : 1)
              '; then
              ok=1
              break
            fi
            echo "Opublikowany update.json jeszcze nie jest widoczny (próba ${attempt}/12)."
            sleep 10
          done
          if [ "$ok" != 1 ]; then
            echo "::error::Adres releases/latest/download/update.json nie wskazuje wydania ${GITHUB_REF_NAME}."
            exit 1
          fi
          curl -fsSL "$(node -p "require('./published.json').apkUrl")" -o downloaded.apk
          echo "$(node -p "require('./published.json').sha256")  downloaded.apk" | sha256sum --check
